# Development Environment Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"  # Expose for development access

  redis:
    environment:
      REDIS_PASSWORD: ""  # No password for dev
    command: redis-server
    ports:
      - "6379:6379"  # Expose for development access

  # LocalStack (S3-compatible storage simulation for development)
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lodestone-network

  # Azurite (Azure Blob simulation for development)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    volumes:
      - azurite_data:/data
    ports:
      - "10000:10000"
    networks:
      - lodestone-network

  api-gateway:
    environment:
      # Development overrides
      LOG_LEVEL: debug
      LOG_FORMAT: text
      JWT_SECRET: dev-secret-key-change-in-production
      CORS_ORIGINS: "*"
      DB_SSLMODE: disable
      
      # Storage config (using local for dev)
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/artifacts
      STORAGE_S3_BUCKET: lodestone-artifacts
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: test
      STORAGE_S3_SECRET_KEY: test
      STORAGE_S3_ENDPOINT: http://localstack:4566
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_AZURE_CONTAINER: lodestone-artifacts
      STORAGE_AZURE_CONNECTION_STRING: UseDevelopmentStorage=true
      STORAGE_AZURE_ENDPOINT: http://azurite:10000/devstoreaccount1
      
      # Development features
      RATE_LIMIT_RPS: 1000  # Higher limit for dev

volumes:
  localstack_data:
    driver: local
  azurite_data:
    driver: local
